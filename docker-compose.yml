services:
  postgres:
    image: postgres:16
    container_name: e-commerce-postgres
    environment:
      POSTGRES_DB: e-commerce
      POSTGRES_USER: gy
      POSTGRES_PASSWORD: "0000"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gy -d e-commerce"]
      interval: 5s
      timeout: 5s
      retries: 5
  pg-server:
    build: ../pg-api
    ports:
      - "9090:9090"

volumes:
  postgres-data:
